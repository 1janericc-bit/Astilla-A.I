name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version

          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $RAW_VERSION"

          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Unable to detect Java version from java -version." >&2
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ ^1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$RAW_VERSION" =~ ^([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "Error: Could not parse Java major version from '$RAW_VERSION'." >&2
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Java major version '$JAVA_MAJOR' is not a valid integer." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than required version 17." >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR is active (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "./debug.keystore does not exist. Generating temporary debug keystore..."
            KEYTOOL="$JAVA_HOME/bin/keytool"
            if [ ! -x "$KEYTOOL" ]; then
              KEYTOOL="$(which keytool)"
            fi

            if [ -z "$KEYTOOL" ] || [ ! -x "$KEYTOOL" ]; then
              echo "Error: keytool executable not found in configured Java installation." >&2
              exit 1
            fi

            "$KEYTOOL" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore." >&2
              exit 1
            fi
            echo "Successfully generated temporary debug keystore."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore verification failed after generation." >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK not found at '$TARGET_APK'." >&2
            echo "Searching only inside app/build/outputs/apk for discovered APK files:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory 'app/build/outputs/apk' does not exist."
            fi
            exit 1
          fi

          # Confirm that the selected APK exists
          if [ ! -e "$TARGET_APK" ]; then
            echo "Error: Selected APK does not exist at '$TARGET_APK'." >&2
            exit 1
          fi

          # Confirm that the selected APK is a regular file
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Selected APK '$TARGET_APK' is not a regular file." >&2
            exit 1
          fi

          # Confirm that the selected APK is not empty
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Selected APK '$TARGET_APK' is empty (0 bytes)." >&2
            exit 1
          fi

          # Confirm that the selected APK has the .apk extension
          if [[ "$TARGET_APK" != *.apk ]]; then
            echo "Error: Selected APK '$TARGET_APK' does not have the .apk extension." >&2
            exit 1
          fi

          # Confirm that the selected APK is exactly app/build/outputs/apk/debug/app-debug.apk
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK '$TARGET_APK' is not exactly 'app/build/outputs/apk/debug/app-debug.apk'." >&2
            exit 1
          fi

          echo "APK verification passed: $TARGET_APK ($(wc -c < "$TARGET_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_TEMP_DIR="${{ runner.temp }}/release-asset"
          rm -rf "$RELEASE_TEMP_DIR"
          mkdir -p "$RELEASE_TEMP_DIR"

          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_TEMP_DIR/app-debug.apk"

          if [ ! -s "$RELEASE_TEMP_DIR/app-debug.apk" ]; then
            echo "Error: Failed to copy APK to temporary release directory '$RELEASE_TEMP_DIR'." >&2
            exit 1
          fi

          echo "Successfully prepared APK release asset at $RELEASE_TEMP_DIR/app-debug.apk"

      - name: Publish debug APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ github.run_number }}
          name: "Debug APK v${{ github.run_number }}"
          body: |
            Automated debug APK build from commit ${{ github.sha }}.
            Download `app-debug.apk` directly to install and test on an Android phone.
          draft: false
          prerelease: false
          files: ${{ runner.temp }}/release-asset/app-debug.apk
